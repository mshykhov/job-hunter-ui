<!doctype html>
<meta charset="utf-8" />
<title>Typography</title>
<style>
  body {
    margin: 0; padding: 28px;
    background: #0F0F12; color: #E6E6E8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid #2A2A2E; }
  .label { width: 130px; color: #8A8A93; font-size: 12px; }
  .t-page { font-size: 30px; font-weight: 600; }
  .t-section { font-size: 20px; font-weight: 600; }
  .t-body { font-size: 14px; }
  .t-small { font-size: 12px; color: #8A8A93; }
  .t-num { font-size: 14px; font-variant-numeric: tabular-nums; }
  .note { margin-top: 20px; color: #8A8A93; font-size: 12px; }
  code { background: #1A1A1E; border: 1px solid #2A2A2E; border-radius: 4px; padding: 1px 6px; }
</style>
<div class="row"><div class="label">Page title</div><div class="t-page">Jobs</div></div>
<div class="row"><div class="label">Section</div><div class="t-section">Filters</div></div>
<div class="row"><div class="label">Body</div><div class="t-body">Senior Java IVR Application Developer</div></div>
<div class="row"><div class="label">Caption / meta</div><div class="t-small">89 jobs · Updated 12:39:56</div></div>
<div class="row"><div class="label">Tabular nums</div><div class="t-num">82% · 12h 23m ago</div></div>
<p class="note">Font stack: <code>-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif</code> · numeric columns use tabular-nums for alignment.</p>
