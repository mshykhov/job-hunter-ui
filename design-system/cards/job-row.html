<!doctype html>
<meta charset="utf-8" />
<title>Job row</title>
<style>
  body {
    margin: 0;
    padding: 28px;
    background: #0f0f12;
    color: #e6e6e8;
    font:
      14px/1.4 -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      sans-serif;
  }
  h2 {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8a93;
    margin: 0 0 12px;
    font-weight: 600;
  }
  .list {
    background: #1a1a1e;
    border: 1px solid #2a2a2e;
    border-radius: 6px;
    overflow: hidden;
  }
  .row {
    position: relative;
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1.3fr) 190px;
    grid-template-areas: "ring main meta trail";
    align-items: center;
    column-gap: 16px;
    padding: 12px 16px 12px 38px;
    border-top: 1px solid #26262b;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:first-child {
    border-top: none;
  }
  .row:hover {
    background: rgba(255, 255, 255, 0.04);
  }
  /* Active keyboard cursor - the row the shortcuts act on */
  .row--selected {
    background: rgba(79, 70, 229, 0.16);
    box-shadow: inset 3px 0 0 #4f46e5;
  }
  .row-index {
    position: absolute;
    left: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    text-align: right;
    font-size: 10px;
    line-height: 1;
    color: #56565e;
    font-variant-numeric: tabular-nums;
  }
  .ring {
    grid-area: ring;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .ring-hi {
    border: 2px solid #52c41a;
    color: #52c41a;
  }
  .ring-mid {
    border: 2px solid #d4b106;
    color: #d4b106;
  }
  .main {
    grid-area: main;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .company {
    font-size: 13px;
    color: #8a8a93;
  }
  .company b {
    color: #e6e6e8;
    font-weight: 500;
  }
  .meta {
    grid-area: meta;
    min-width: 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-size: 13px;
  }
  .trail {
    grid-area: trail;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 12px;
    line-height: 20px;
    border: 1px solid;
  }
  .t-djinni {
    color: #b37feb;
    border-color: #642ab5;
    background: rgba(114, 46, 209, 0.12);
  }
  .t-dou {
    color: #ffa940;
    border-color: #ad4e00;
    background: rgba(212, 107, 8, 0.12);
  }
  .t-eu {
    color: #ffc069;
    border-color: #ad6800;
    background: rgba(212, 136, 6, 0.12);
  }
  .t-new {
    color: #4da3ff;
    border-color: #15417e;
    background: rgba(22, 119, 255, 0.12);
  }
  .t-irrelevant {
    color: #8a8a93;
    border-color: #3a3a40;
    background: rgba(255, 255, 255, 0.04);
  }
  .remote {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: #52c41a;
  }
  .salary {
    color: #e6e6e8;
    font-variant-numeric: tabular-nums;
  }
  .dim {
    color: #8a8a93;
  }
  .time {
    font-size: 12px;
    color: #56565e;
    white-space: nowrap;
  }
</style>
<h2>Job row · list</h2>
<div class="list">
  <div class="row row--selected">
    <span class="row-index">1</span>
    <span class="ring ring-hi">94</span>
    <div class="main">
      <div class="title">Software Engineer (Java)</div>
      <div class="company"><b>Ajax Systems</b> · 3 postings</div>
    </div>
    <div class="meta">
      <span class="tag t-dou">DOU</span>
      <span class="dim">Kyiv +1</span>
    </div>
    <div class="trail">
      <span class="tag t-new">New</span>
      <span class="time">5h ago</span>
    </div>
  </div>
  <div class="row">
    <span class="row-index">2</span>
    <span class="ring ring-hi">82</span>
    <div class="main">
      <div class="title">Back-End Engineer (Java, Node.js)</div>
      <div class="company"><b>ORIL</b> · 2 postings</div>
    </div>
    <div class="meta">
      <span class="tag t-djinni">Djinni</span>
      <span class="tag t-dou">DOU</span>
      <span class="remote">&#10003; Remote</span>
      <span class="dim">Львів</span>
    </div>
    <div class="trail">
      <span class="tag t-new">New</span>
      <span class="time">13h ago</span>
    </div>
  </div>
  <div class="row">
    <span class="row-index">3</span>
    <span class="ring ring-mid">72</span>
    <div class="main">
      <div class="title">Senior Sales Engineer &#8211; DevTools</div>
      <div class="company"><b>Perforce</b></div>
    </div>
    <div class="meta">
      <span class="tag t-eu">EuRemoteJobs</span>
      <span class="remote">&#10003; Remote</span>
      <span class="salary">$5500</span>
      <span class="dim">US</span>
    </div>
    <div class="trail">
      <span class="tag t-irrelevant">Irrelevant</span>
      <span class="time">1d ago</span>
    </div>
  </div>
</div>
